[project]
name = "neon-dump-2-xls"
version = "0.1.0"
description = "Export a Neon PostgreSQL database to a multi-sheet Excel workbook"
readme = "idea.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
neon-dump = "app.main:main"
provision-readonly = "scripts.provision_readonly_user:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11.0"]
